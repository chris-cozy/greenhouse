<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="theme-color" content="#0f1712"/>
  <meta name="description" content="Greenhouse — your local botanical archive and plant journal."/>
  <title>Greenhouse</title>
  <script>
    // Run before styles load, even when storage is blocked. Only an explicit false opts out.
    try {
      document.documentElement.setAttribute("data-forest-aesthetic", String(localStorage.getItem("greenhouse-forest-aesthetic") !== "false"));
    } catch {
      document.documentElement.setAttribute("data-forest-aesthetic", "true");
    }
  </script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
